<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPOINT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd}.top{max-width:1100px;margin:auto;padding:12px;display:flex;gap:12px;align-items:center}.logo{font-size:26px;font-weight:900;letter-spacing:-2px;cursor:pointer}.search{flex:1;display:flex;background:#f1f1f1;border-radius:24px;overflow:hidden}.search input{flex:1;border:0;background:transparent;padding:12px;outline:0}.search button{border:0;background:#111;color:#fff;padding:0 15px}.icon{border:0;background:#fff;font-size:20px;cursor:pointer}.cart{border:0;background:#111;color:#fff;border-radius:20px;padding:10px 13px}nav{display:flex;gap:7px;overflow:auto;max-width:1100px;margin:auto;padding:0 12px 10px}nav button{border:0;background:#eee;border-radius:20px;padding:8px 14px;white-space:nowrap}main{max-width:1100px;margin:auto;padding:18px 12px}.hero{background:#111;color:white;border-radius:20px;padding:35px 22px;margin-bottom:25px}.hero h1{font-size:43px;line-height:.95;margin:10px 0}.btn{border:0;background:#111;color:#fff;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer}.hero .btn{background:#fff;color:#111}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{border:1px solid #ddd;background:#fff;border-radius:20px;padding:9px 14px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #e2e2e2}.pic{height:190px;background:linear-gradient(135deg,#ddd,#aaa);display:flex;align-items:center;justify-content:center;font-size:58px}.body{padding:12px}.price{font-weight:900;margin:7px 0 10px}.add{width:100%;border:0;background:#111;color:#fff;padding:11px;border-radius:9px;font-weight:700}.page{display:none}.page.active{display:block}.panel{background:#fff;border-radius:15px;padding:20px}.cartrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px;margin:9px 0}.cartrow .mini{width:65px;height:65px;border-radius:10px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:30px}.grow{flex:1}.qty button{padding:5px 10px}.total{text-align:right;font-size:21px;font-weight:900;margin:18px 0}.empty{text-align:center;background:#fff;padding:30px;border-radius:15px}footer{background:#111;color:#fff;padding:30px;text-align:center;margin-top:35px}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:9px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:150px}.hero h1{font-size:34px}.search button{display:none}.top{gap:8px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.pic{height:200px}}
</style></head><body>
<header><div class="top"><div class="logo" onclick="go('home')">JPOINT</div><div class="search"><input id="q" placeholder="Produkte suchen..." oninput="renderShop()"><button onclick="go('shop')">Suchen</button></div><button class="icon" onclick="go('account')">♙</button><button class="cart" onclick="go('cart')">🛒 <span id="count">0</span></button></div>
<nav><button onclick="go('home')">Shop</button><button onclick="filter('Neu')">Neu</button><button onclick="filter('Deals')">Deals</button><button onclick="filter('Herren')">Herren</button><button onclick="filter('Damen')">Damen</button><button onclick="filter('Schuhe')">Schuhe</button><button onclick="go('wishlist')">♡ Wunschliste</button></nav></header>
<main>
<section id="home" class="page active"><div class="hero"><small>JPOINT STREETWEAR</small><h1>DEIN STYLE.<br>DEIN POINT.</h1><p>Streetwear, Basics & Sneaker.</p><button class="btn" onclick="go('shop')">Jetzt shoppen</button></div><h2>Beliebte Produkte</h2><div id="homeGrid" class="grid"></div></section>
<section id="shop" class="page"><h1>Shop</h1><div class="tabs"><button onclick="filter('Alle')">Alle</button><button onclick="filter('Herren')">Herren</button><button onclick="filter('Damen')">Damen</button><button onclick="filter('Schuhe')">Schuhe</button><button onclick="filter('Streetwear')">Streetwear</button></div><div id="shopGrid" class="grid"></div></section>
<section id="product" class="page"><div id="detail"></div></section>
<section id="cart" class="page"><h1>🛒 Warenkorb</h1><div id="cartBox"></div></section>
<section id="wishlist" class="page"><h1>♡ Wunschliste</h1><div id="wishBox" class="grid"></div></section>
<section id="account" class="page"><div class="panel"><h1>Mein Konto</h1><p>Dein JPOINT-Konto</p><input placeholder="E-Mail"><input type="password" placeholder="Passwort"><button class="btn" onclick="alert('Demo: Anmeldung vorbereitet')">Anmelden</button></div></section>
<section id="checkout" class="page"><div class="panel"><h1>Kasse</h1><p>Demo-Checkout – noch keine echte Zahlung.</p><input placeholder="Vorname & Nachname"><input placeholder="E-Mail"><input placeholder="Adresse"><input placeholder="PLZ & Ort"><button class="btn" onclick="alert('Demo-Bestellung erstellt!')">Bestellung abschicken</button></div></section>
<section id="contact" class="page"><div class="panel"><h1>Kontakt</h1><input placeholder="Name"><input placeholder="E-Mail"><textarea placeholder="Nachricht"></textarea><button class="btn" onclick="alert('Nachricht gesendet (Demo)')">Senden</button></div></section>
</main><footer><b>JPOINT</b><p>© JPOINT Demo-Shop · <button class="icon" onclick="go('contact')">Kontakt</button></p></footer>
<script>
const P=[
[1,"Oversized T-Shirt","Herren",18.90,"👕"],[2,"Zip Hoodie","Streetwear",34.90,"🧥"],[3,"Cargo Pants","Herren",29.90,"👖"],[4,"Retro Sneaker","Schuhe",49.90,"👟"],[5,"Cropped Top","Damen",21.90,"👚"],[6,"Denim Jacket","Streetwear",42.90,"🧥"],[7,"Wide Leg Jeans","Damen",31.90,"👖"],[8,"Longsleeve","Herren",19.90,"👕"],[9,"Basic Hoodie","Herren",27.90,"🧥"],[10,"Runner Sneaker","Schuhe",54.90,"👟"],[11,"Street Cargo","Streetwear",36.90,"👖"],[12,"Basic Top","Damen",17.90,"👚"]];
let cart=JSON.parse(localStorage.getItem("jp_cart")||"[]"),wish=JSON.parse(localStorage.getItem("jp_wish")||"[]"),cat="Alle";
const euro=x=>x.toFixed(2).replace(".",",")+" €";
function save(){localStorage.setItem("jp_cart",JSON.stringify(cart));localStorage.setItem("jp_wish",JSON.stringify(wish));count()}
function count(){document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.q,0)}
function go(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0);if(id==="shop")renderShop();if(id==="cart")renderCart();if(id==="wishlist")renderWish();count()}
function filter(c){cat=c;go("shop")}
function card(p){let[w,n,c,pr,e]=p;return `<article class="card"><div class="pic" onclick="detail(${w})">${e}</div><div class="body"><b>${n}</b><div>${c}</div><div class="price">${euro(pr)}</div><button class="add" onclick="add(${w})">In den Warenkorb</button><button class="icon" onclick="toggleWish(${w})">♡</button></div></article>`}
function list(){let q=document.getElementById("q").value.toLowerCase();return P.filter(p=>(cat==="Alle"||p[2]===cat||cat==="Neu"||cat==="Deals")&&(p[1]+" "+p[2]).toLowerCase().includes(q))}
function renderShop(){document.getElementById("shopGrid").innerHTML=list().map(card).join("")||'<div class="empty">Keine Produkte gefunden.</div>'}
function add(id){let x=cart.find(a=>a.id===id);x?x.q++:cart.push({id,q:1});save();alert("Produkt wurde zum Warenkorb hinzugefügt!")}
function detail(id){let p=P.find(x=>x[0]===id);document.getElementById("detail").innerHTML=`<div class="panel"><div class="pic" style="height:300px">${p[4]}</div><h1>${p[1]}</h1><p>${p[2]}</p><h2>${euro(p[3])}</h2><p>JPOINT Streetwear – modernes Teil für deinen Look.</p><button class="btn" onclick="add(${p[0]})">In den Warenkorb</button></div>`;go("product")}
function renderCart(){if(!cart.length){document.getElementById("cartBox").innerHTML='<div class="empty">Dein Warenkorb ist leer.<br><br><button class="btn" onclick="go(\'shop\')">Zum Shop</button></div>';return}let t=0;document.getElementById("cartBox").innerHTML=cart.map(x=>{let p=P.find(a=>a[0]===x.id);t+=p[3]*x.q;return `<div class="cartrow"><div class="mini">${p[4]}</div><div class="grow"><b>${p[1]}</b><br>${euro(p[3])}<div class="qty"><button onclick="change(${p[0]},-1)">−</button> ${x.q} <button onclick="change(${p[0]},1)">+</button> <button onclick="removeIt(${p[0]})">Löschen</button></div></div></div>`}).join("")+`<div class="total">Gesamt: ${euro(t)}</div><button class="btn" onclick="go('checkout')">Zur Kasse</button>`}
function change(id,d){let x=cart.find(a=>a.id===id);x.q+=d;if(x.q<1)cart=cart.filter(a=>a.id!==id);save();renderCart()}
function removeIt(id){cart=cart.filter(a=>a.id!==id);save();renderCart()}
function toggleWish(id){wish.includes(id)?wish=wish.filter(x=>x!==id):wish.push(id);save();alert(wish.includes(id)?"Zur Wunschliste hinzugefügt!":"Von Wunschliste entfernt.")}
function renderWish(){document.getElementById("wishBox").innerHTML=wish.length?P.filter(p=>wish.includes(p[0])).map(card).join(""):'<div class="empty">Noch nichts auf deiner Wunschliste.</div>'}
document.getElementById("homeGrid").innerHTML=P.slice(0,8).map(card).join("");renderShop();count();
</script></body></html>
